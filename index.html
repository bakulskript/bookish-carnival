<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img.scdn.io CORS Test (Instagram Fix)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        pre {
            background: #111;
            color: #eee;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .success { color: #4caf50; }
        .error   { color: #f44336; }
    </style>
</head>
<body>

<h2>img.scdn.io CORS Test (dengan perbaikan untuk Instagram)</h2>
<pre id="result">Memproses...</pre>

<script>
    (async function () {
        const result = document.getElementById('result');

        function show(data) {
            result.textContent = JSON.stringify(data, null, 2);
        }

        const params = new URLSearchParams(window.location.search);
        let imageUrl = params.get('url');

        if (!imageUrl) {
            show({
                success: false,
                error: 'Parameter URL tidak ditemukan',
                usage: 'https://bakulskript.github.io/bookish-carnival/?url=https://example.com/image.jpg'
            });
            return;
        }

        // Fungsi untuk mengirim permintaan ke img.scdn.io
        async function fetchImgScdn(url, referer = null, userAgent = null) {
            const formData = new FormData();
            formData.append('image_url', url);
            formData.append('outputFormat', 'auto');
            formData.append('cdn_domain', 'default');
            formData.append('storage_destination', 'local');

            // Tambahkan header yang mungkin diteruskan oleh server
            if (referer) formData.append('referer', referer);
            if (userAgent) formData.append('user_agent', userAgent);

            const response = await fetch('https://img.scdn.io/api/v1.php', {
                method: 'POST',
                body: formData
            });

            const text = await response.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch {
                data = { success: false, parseError: true, raw: text };
            }
            return { response, data };
        }

        try {
            // Validasi URL
            let parsedUrl;
            try {
                parsedUrl = new URL(imageUrl);
            } catch {
                throw new Error('URL gambar tidak valid');
            }

            if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                throw new Error('Hanya protokol HTTP dan HTTPS yang diizinkan');
            }

            // ---------- PERMINTAAN PERTAMA (dengan referer & user-agent) ----------
            const { response: res1, data: data1 } = await fetchImgScdn(
                imageUrl,
                'https://www.instagram.com/',
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            );

            // Jika sukses, tampilkan hasil
            if (res1.ok && data1.success) {
                show({
                    success: true,
                    cors: true,
                    http_status: res1.status,
                    img_scdn_response: data1,
                    note: 'Berhasil dengan referer + user-agent.'
                });
                return;
            }

            // ---------- FALLBACK: coba tanpa query string (jika error 403/400) ----------
            if (res1.status === 400 || res1.status === 403) {
                // Potong query string
                const baseUrl = parsedUrl.origin + parsedUrl.pathname;
                // Coba lagi dengan URL yang sudah dibersihkan
                const { response: res2, data: data2 } = await fetchImgScdn(
                    baseUrl,
                    'https://www.instagram.com/',
                    'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                );

                if (res2.ok && data2.success) {
                    show({
                        success: true,
                        cors: true,
                        http_status: res2.status,
                        img_scdn_response: data2,
                        note: 'Berhasil setelah menghapus query string.'
                    });
                    return;
                }

                // Jika gagal lagi, tampilkan error gabungan
                show({
                    success: false,
                    cors: true,
                    http_status: res2.status,
                    img_scdn_response: data2,
                    error: 'Gagal mengakses gambar Instagram meskipun sudah dicoba dengan dan tanpa query string.',
                    saran: 'Coba gunakan URL gambar yang sudah di-cache atau layanan proxy lain (misal: https://corsproxy.io/).'
                });
                return;
            }

            // Jika gagal dengan status lain
            show({
                success: false,
                cors: true,
                http_status: res1.status,
                img_scdn_response: data1,
                error: 'Gagal mengakses API img.scdn.io.'
            });

        } catch (error) {
            show({
                success: false,
                cors: false,
                error: error.name,
                message: error.message,
                note: 'Jika browser menampilkan CORS error di Console, berarti GitHub Pages tidak dapat mengakses API img.scdn.io secara langsung.'
            });
            console.error('FULL ERROR:', error);
        }
    })();
</script>

</body>
</html>

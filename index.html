<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img.scdn.io CORS Test (Mirip Postman)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        pre {
            background: #111;
            color: #eee;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .success { color: #4caf50; }
        .error   { color: #f44336; }
    </style>
</head>
<body>

<h2>img.scdn.io CORS Test (Postman Style)</h2>
<pre id="result">Memproses...</pre>

<script>
    (async function () {
        const result = document.getElementById('result');

        function show(data) {
            result.textContent = JSON.stringify(data, null, 2);
        }

        const params = new URLSearchParams(window.location.search);
        let originalUrl = params.get('url');

        if (!originalUrl) {
            show({
                success: false,
                error: 'Parameter URL tidak ditemukan',
                usage: 'https://bakulskript.github.io/bookish-carnival/?url=https://example.com/image.jpg'
            });
            return;
        }

        try {
            // Validasi URL
            let parsedUrl;
            try {
                parsedUrl = new URL(originalUrl);
            } catch {
                throw new Error('URL gambar tidak valid');
            }

            if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                throw new Error('Hanya protokol HTTP dan HTTPS yang diizinkan');
            }

            // ---------- ENCODE URL untuk query string (hanya ganti & dengan %26) ----------
            // Ini sesuai dengan yang dilakukan Postman
            const encodedForQuery = originalUrl.replace(/&/g, '%26');

            // Bangun URL API dengan parameter di query string
            const apiUrl = new URL('https://img.scdn.io/api/v1.php');
            apiUrl.searchParams.set('outputFormat', 'auto');
            apiUrl.searchParams.set('cdn_domain', 'default');
            apiUrl.searchParams.set('storage_destination', 'local');
            // Set image_url dengan nilai yang sudah di-encode secara manual
            // Karena URLSearchParams akan meng-encode lagi, kita set langsung sebagai string
            // Kita override dengan menggabungkan manual
            const baseUrl = apiUrl.toString().split('?')[0];
            const queryParams = new URLSearchParams({
                outputFormat: 'auto',
                cdn_domain: 'default',
                storage_destination: 'local'
            });
            // Tambahkan image_url dengan encoding khusus (hanya &)
            const finalUrl = `${baseUrl}?${queryParams.toString()}&image_url=${encodedForQuery}`;

            // ---------- BUAT FORMDATA untuk body (field image_url dengan nilai mentah) ----------
            const formData = new FormData();
            formData.append('image_url', originalUrl); // nilai asli, tanpa encoding

            // ---------- KIRIM REQUEST ----------
            const response = await fetch(finalUrl, {
                method: 'POST',
                body: formData,          // otomatis set Content-Type: multipart/form-data
                headers: {
                    'Accept': '*/*'
                },
                credentials: 'include'   // kirim cookie jika ada (misal PHPSESSID)
            });

            const text = await response.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch {
                data = { success: false, parseError: true, raw: text };
            }

            // ---------- TAMPILKAN HASIL ----------
            if (response.ok && data.success) {
                show({
                    success: true,
                    cors: true,
                    http_status: response.status,
                    used_method: 'query string (encode &) + FormData body',
                    original_url: originalUrl,
                    encoded_url_sent: encodedForQuery,
                    final_request_url: finalUrl,
                    img_scdn_response: data
                });
            } else {
                show({
                    success: false,
                    cors: true,
                    http_status: response.status,
                    used_method: 'query string + FormData',
                    img_scdn_response: data,
                    error: 'Gagal memproses gambar. Mungkin URL sudah kedaluwarsa.'
                });
            }

        } catch (error) {
            show({
                success: false,
                cors: false,
                error: error.name,
                message: error.message,
                note: 'Jika CORS error, berarti browser memblokir. Pastikan tidak ada ekstensi yang mengganggu.'
            });
            console.error('FULL ERROR:', error);
        }
    })();
</script>

</body>
</html>

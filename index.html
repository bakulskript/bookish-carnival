<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img.scdn.io CORS Test (dengan proxy weserv)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        pre {
            background: #111;
            color: #eee;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .success { color: #4caf50; }
        .error   { color: #f44336; }
    </style>
</head>
<body>

<h2>img.scdn.io CORS Test (Proxy untuk Instagram)</h2>
<pre id="result">Memproses...</pre>

<script>
    (async function () {
        const result = document.getElementById('result');

        function show(data) {
            result.textContent = JSON.stringify(data, null, 2);
        }

        const params = new URLSearchParams(window.location.search);
        let originalUrl = params.get('url');

        if (!originalUrl) {
            show({
                success: false,
                error: 'Parameter URL tidak ditemukan',
                usage: 'https://bakulskript.github.io/bookish-carnival/?url=https://example.com/image.jpg'
            });
            return;
        }

        try {
            // Validasi URL
            let parsedUrl;
            try {
                parsedUrl = new URL(originalUrl);
            } catch {
                throw new Error('URL gambar tidak valid');
            }

            if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                throw new Error('Hanya protokol HTTP dan HTTPS yang diizinkan');
            }

            // Deteksi apakah URL berasal dari Instagram (domain fbcdn.net atau instagram.com)
            const host = parsedUrl.hostname.toLowerCase();
            const isInstagram = host.includes('fbcdn.net') || host.includes('instagram.com');

            let finalUrl = originalUrl;

            // Jika dari Instagram, bungkus dengan proxy weserv.nl
            if (isInstagram) {
                const proxyBase = 'https://images.weserv.nl/';
                // Parameter 'url' harus di-encode
                const encoded = encodeURIComponent(originalUrl);
                finalUrl = proxyBase + '?url=' + encoded;
                // Opsional: kita bisa tambahkan parameter lain seperti 'output=webp' tapi nanti di img.scdn.io juga diubah
            }

            // Kirim ke img.scdn.io
            const formData = new FormData();
            formData.append('image_url', finalUrl);
            formData.append('outputFormat', 'webp');

            // Sertakan header pendukung (tidak wajib, tapi aman)
            formData.append('referer', 'https://www.instagram.com/');
            formData.append('user_agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');

            const response = await fetch('https://img.scdn.io/api/v1.php', {
                method: 'POST',
                body: formData
            });

            const text = await response.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch {
                data = { success: false, parseError: true, raw: text };
            }

            if (response.ok && data.success) {
                show({
                    success: true,
                    cors: true,
                    http_status: response.status,
                    used_proxy: isInstagram ? 'weserv.nl' : 'langsung',
                    original_url: originalUrl,
                    final_url_sent: finalUrl,
                    img_scdn_response: data,
                    note: 'Berhasil menggunakan proxy weserv.nl untuk gambar Instagram.'
                });
            } else {
                // Gagal
                show({
                    success: false,
                    cors: true,
                    http_status: response.status,
                    used_proxy: isInstagram ? 'weserv.nl' : 'langsung',
                    img_scdn_response: data,
                    error: 'Gagal memproses gambar melalui img.scdn.io.',
                    saran: 'Jika masih gagal, coba gunakan URL gambar yang sudah di-cache atau unduh manual lalu unggah ke layanan seperti imgbb.com.'
                });
            }

        } catch (error) {
            show({
                success: false,
                cors: false,
                error: error.name,
                message: error.message,
                note: 'Jika browser menampilkan CORS error di Console, berarti GitHub Pages tidak dapat mengakses API img.scdn.io secara langsung.'
            });
            console.error('FULL ERROR:', error);
        }
    })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img.scdn.io CORS Test (Postman exact)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        pre {
            background: #111;
            color: #eee;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .success { color: #4caf50; }
        .error   { color: #f44336; }
    </style>
</head>
<body>

<h2>img.scdn.io CORS Test (Postman exact)</h2>
<pre id="result">Memproses...</pre>

<script>
    (async function () {
        const result = document.getElementById('result');

        function show(data) {
            result.textContent = JSON.stringify(data, null, 2);
        }

        const params = new URLSearchParams(window.location.search);
        let originalUrl = params.get('url');

        if (!originalUrl) {
            show({
                success: false,
                error: 'Parameter URL tidak ditemukan',
                usage: 'https://bakulskript.github.io/bookish-carnival/?url=https://example.com/image.jpg'
            });
            return;
        }

        try {
            let parsedUrl;
            try {
                parsedUrl = new URL(originalUrl);
            } catch {
                throw new Error('URL gambar tidak valid');
            }

            if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                throw new Error('Hanya protokol HTTP dan HTTPS yang diizinkan');
            }

            const isInstagram = parsedUrl.hostname.includes('fbcdn.net') || parsedUrl.hostname.includes('instagram.com');

            // Fungsi kirim ke img.scdn.io persis seperti Postman
            async function sendToImgScdn(imageUrl) {
                // Bangun URL dengan parameter di query string (seperti di Postman)
                const apiUrl = new URL('https://img.scdn.io/api/v1.php');
                apiUrl.searchParams.set('outputFormat', 'auto');
                apiUrl.searchParams.set('cdn_domain', 'default');
                apiUrl.searchParams.set('storage_destination', 'local');
                apiUrl.searchParams.set('image_url', imageUrl); // juga di query string

                // Buat FormData dan tambahkan field image_url (seperti di body Postman)
                const formData = new FormData();
                formData.append('image_url', imageUrl);

                const response = await fetch(apiUrl.toString(), {
                    method: 'POST',
                    body: formData, // ini akan mengirim multipart/form-data dengan field image_url
                    headers: {
                        'Accept': '*/*'
                    },
                    credentials: 'include' // kirim cookie jika ada
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { success: false, parseError: true, raw: text };
                }
                return { response, data };
            }

            // Coba langsung tanpa proxy
            const { response, data } = await sendToImgScdn(originalUrl);
            if (response.ok && data.success) {
                show({
                    success: true,
                    cors: true,
                    http_status: response.status,
                    used_method: 'query string + FormData (image_url di body)',
                    original_url: originalUrl,
                    img_scdn_response: data
                });
            } else {
                show({
                    success: false,
                    http_status: response.status,
                    img_scdn_response: data,
                    error: 'Gagal memproses gambar.',
                    note: 'Pastikan URL masih valid (token oh/oe belum kedaluwarsa).'
                });
            }

        } catch (error) {
            show({
                success: false,
                cors: false,
                error: error.name,
                message: error.message,
                note: 'Jika CORS error, berarti browser memblokir. Gunakan ekstensi CORS atau proxy.'
            });
            console.error('FULL ERROR:', error);
        }
    })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img.scdn.io CORS Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        pre {
            background: #111;
            color: #eee;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<h2>img.scdn.io CORS Test</h2>

<pre id="result">Testing...</pre>

<script>

(async function () {

    const result = document.getElementById("result");

    function show(data) {
        result.textContent = JSON.stringify(data, null, 2);
    }

    const params = new URLSearchParams(window.location.search);
    const imageUrl = params.get("url");

    if (!imageUrl) {

        show({
            success: false,
            error: "Missing image URL",
            usage:
                "https://username.github.io/image-api/?url=https://example.com/image.jpg"
        });

        return;
    }

    try {

        /*
         * Validate URL
         */
        let parsedUrl;

        try {
            parsedUrl = new URL(imageUrl);
        } catch {

            throw new Error("Invalid image URL");
        }

        if (
            parsedUrl.protocol !== "http:" &&
            parsedUrl.protocol !== "https:"
        ) {
            throw new Error("Only HTTP and HTTPS URLs are allowed");
        }


        /*
         * Create FormData
         */
        const formData = new FormData();

        formData.append("image_url", imageUrl);
        formData.append("outputFormat", "webp");


        /*
         * Send request to img.scdn.io
         */
        const response = await fetch(
            "https://img.scdn.io/api/v1.php",
            {
                method: "POST",
                body: formData
            }
        );


        /*
         * Read response
         */
        const text = await response.text();


        /*
         * Try JSON
         */
        let data;

        try {

            data = JSON.parse(text);

        } catch {

            show({
                success: false,

                stage: "response",

                http_status: response.status,

                content_type:
                    response.headers.get("content-type"),

                response: text
            });

            return;
        }


        /*
         * Success
         */
        show({

            success: true,

            cors: true,

            http_status: response.status,

            img_scdn_response: data

        });

    }

    catch (error) {

        show({

            success: false,

            cors: false,

            error: error.name,

            message: error.message,

            note:
                "Jika browser menampilkan CORS error di Console, berarti GitHub Pages tidak dapat mengakses API img.scdn.io secara langsung."

        });

        console.error("FULL ERROR:", error);

    }

})();

</script>

</body>
</html>

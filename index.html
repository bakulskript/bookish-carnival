<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img.scdn.io Upload via Blob</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
        pre { background: #111; color: #eee; padding: 20px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; max-height: 600px; overflow: auto; }
        .success { color: #4caf50; }
        .error   { color: #f44336; }
        .info    { color: #2196F3; }
        #status { background: #333; color: #fff; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>Upload Gambar ke img.scdn.io (via Blob)</h2>
<div id="status">⏳ Memproses...</div>
<pre id="result">Menunggu...</pre>

<script>
    (async function () {
        const result = document.getElementById('result');
        const status = document.getElementById('status');

        function show(data) {
            result.textContent = JSON.stringify(data, null, 2);
            status.textContent = data.success ? '✅ Berhasil' : '❌ Gagal';
            status.style.background = data.success ? '#1b5e20' : '#b71c1c';
        }

        const params = new URLSearchParams(window.location.search);
        let originalUrl = params.get('url');

        if (!originalUrl) {
            show({
                success: false,
                error: 'Parameter URL tidak ditemukan',
                usage: 'https://bakulskript.github.io/bookish-carnival/?url=https://example.com/image.jpg'
            });
            return;
        }

        try {
            // Validasi URL
            let parsedUrl;
            try {
                parsedUrl = new URL(originalUrl);
            } catch {
                throw new Error('URL gambar tidak valid');
            }
            if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                throw new Error('Hanya protokol HTTP dan HTTPS yang diizinkan');
            }

            // ---------- STEP 1: Download gambar via proxy CORS ----------
            status.textContent = '⬇️ Mengunduh gambar dari Instagram...';
            // Gunakan proxy yang mendukung CORS
            const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(originalUrl)}`;
            // Alternatif: images.weserv.nl
            // const proxyUrl = `https://images.weserv.nl/?url=${encodeURIComponent(originalUrl)}`;

            const downloadResponse = await fetch(proxyUrl, {
                headers: {
                    'Accept': 'image/*'
                }
            });

            if (!downloadResponse.ok) {
                throw new Error(`Gagal mengunduh gambar: HTTP ${downloadResponse.status}`);
            }

            // Dapatkan blob dari respons
            const blob = await downloadResponse.blob();
            const contentType = blob.type || 'image/jpeg'; // fallback
            const extension = contentType.split('/')[1] || 'jpg';

            // ---------- STEP 2: Upload blob ke img.scdn.io ----------
            status.textContent = '⬆️ Mengunggah ke img.scdn.io...';
            const formData = new FormData();
            // Field 'image' untuk file, bukan 'image_url'
            formData.append('image', blob, `image.${extension}`);
            formData.append('outputFormat', 'auto');
            formData.append('cdn_domain', 'default');
            formData.append('storage_destination', 'local');

            const uploadResponse = await fetch('https://img.scdn.io/api/v1.php', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': '*/*'
                },
                credentials: 'include' // kirim cookie jika ada
            });

            const text = await uploadResponse.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch {
                data = { success: false, parseError: true, raw: text };
            }

            // ---------- STEP 3: Tampilkan hasil ----------
            if (uploadResponse.ok && data.success) {
                show({
                    success: true,
                    http_status: uploadResponse.status,
                    method: 'Download via proxy + Upload blob',
                    original_url: originalUrl,
                    proxy_used: proxyUrl,
                    file_size: blob.size,
                    content_type: contentType,
                    img_scdn_response: data,
                    note: '✅ Berhasil! Gambar diunduh dari Instagram via proxy, lalu diunggah sebagai file.'
                });
            } else {
                show({
                    success: false,
                    http_status: uploadResponse.status,
                    method: 'Download via proxy + Upload blob',
                    img_scdn_response: data,
                    error: 'Gagal mengunggah ke img.scdn.io.',
                    saran: 'Periksa kembali URL atau coba proxy lain.'
                });
            }

        } catch (error) {
            show({
                success: false,
                cors: false,
                error: error.name,
                message: error.message,
                note: '❌ Terjadi kesalahan saat mengunduh atau mengunggah.\n' +
                      'Pastikan proxy yang digunakan mendukung CORS dan URL gambar valid.'
            });
            console.error('FULL ERROR:', error);
        }
    })();
</script>

</body>
</html>
